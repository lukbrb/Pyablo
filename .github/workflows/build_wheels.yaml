name: Build wheels

on:
  push:
    branches:
      - "lbarbier/packaging"
    tags:
      - "v*"  # Déclenche le workflow uniquement pour les tags commençant par 'v'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install hdf5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"  # Version minimale supportée par ton projet

      - name: Install build dependencies
        run: pip install scikit-build-core cibuildwheel uv

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *musllinux* *win32"
          CIBW_BUILD_FRONTEND: "build[uv]"

      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release_wheels:
    name: Release wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  
    # Exécute uniquement si le workflow est déclenché par un tag commençant par 'v'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v3
        with:
          path: wheels

      - name: Release wheels
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wheels/wheels-ubuntu-latest/*.whl
            wheels/wheels-macos-latest/*.whl
            wheels/wheels-windows-latest/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
